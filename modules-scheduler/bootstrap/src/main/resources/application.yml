spring:
  profiles:
    active: prod
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${MYSQL_DB}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_HOST}:9092

kakao:
  rest-api-key: ${KAKAO_API_KEY}

server:
  port: 8080