
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google OAuth2 Login</title>
</head>
<body>
<h1>Login with Google</h1>
<p>Click the button below to log in with your Google account:</p>

<form action="https://api.moyeobus.com/api/v1/login/oauth?provider=kakao" method="POST">
    <input type="hidden" name="provider" value="google">
    <button type="submit" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
        Login with Google
    </button>
</form>

</body>
</html>
