spring:
  profiles:
    active: prod   # 기본은 운영 환경

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${MYSQL_DB}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
          ddl-auto: update
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

kakao:
  rest-api-key: ${KAKAO_API_KEY}

springdoc:
  swagger-ui:
    path: /index.html

graphhopper:
  osm-path: /app/osm/south-korea.osm.pbf

server:
  port: 8080