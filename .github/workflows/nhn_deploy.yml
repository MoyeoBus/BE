name: CI/CD Deploy to NHN Cloud

on:
  push:
    branches:
      - feat/#19-nhn-ci-cd

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Build JAR
        run: |
          ./gradlew :modules:bootstrap:api-gateway:clean \
                    :modules:bootstrap:api-gateway:build

      - name: Build Docker image
        run: |
          docker build -t myapp:latest \
            -f modules/bootstrap/api-gateway/Dockerfile .

      - name: Save Docker image as tar
        run: |
          docker save myapp:latest -o myapp.tar

      - name: Check files before SCP
        run: |
          echo "=== Check files exist ==="
          ls -al .
          [ -f myapp.tar ] && echo "✅ myapp.tar OK" || exit 1
          [ -f docker-compose.yml ] && echo "✅ docker-compose.yml OK" || exit 1

      - name: Transfer files to NHN server (docker image + compose 파일)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NHN_HOST }}
          username: ${{ secrets.NHN_USER }}
          key: ${{ secrets.NHN_SSH_KEY }}
          source: "${{ github.workspace }}/myapp.tar,${{ github.workspace }}/docker-compose.yml"
          target: /home/ubuntu/app/
          debug: true

      - name: Deploy on NHN server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.NHN_HOST }}
          username: ${{ secrets.NHN_USER }}
          key: ${{ secrets.NHN_SSH_KEY }}
          script: |
            cd /home/ubuntu/app

            echo "=== Stop running containers ==="
            docker-compose down || true

            echo "=== Load new Docker image ==="
            docker load -i myapp.tar

            echo "=== Start service ==="
            docker-compose up -d